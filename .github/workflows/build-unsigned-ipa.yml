name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - "codex/**"

permissions:
  contents: read

# Production branches share one lock so an older run cannot publish after a
# newer one. Non-production branches only cancel superseded runs of themselves.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GitHub run IDs are monotonic and survive branch/history rewrites.
      EASYSEARCH_BUILD_NUMBER: ${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Show build environment
        run: |
          xcodebuild -version
          xcodebuild -project EasySearch.xcodeproj -scheme EasySearch -showdestinations

      - name: Run unit tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          payload = json.load(sys.stdin)
          candidates = []
          for runtime, runtime_devices in payload.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator")
          print(max(candidates)[1])
          ')"
          echo "Testing on simulator $SIMULATOR_ID"
          xcodebuild test \
            -project EasySearch.xcodeproj \
            -scheme EasySearch \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/EasySearchTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasySearchTests-${{ github.run_number }}
          path: ${{ runner.temp }}/EasySearchTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Build unsigned app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_PUBLISHABLE_KEY:-}" ]]; then
            echo "Missing SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY repository secrets." >&2
            exit 1
          fi
          xcodebuild \
            -project EasySearch.xcodeproj \
            -scheme EasySearch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM='' \
            CODE_SIGN_IDENTITY='' \
            SUPABASE_URL="$SUPABASE_URL" \
            SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/EasySearch.app"
          SHARE_EXTENSION="$APP_PATH/PlugIns/EasySearchShare.appex"
          test -d "$APP_PATH"
          test -x "$APP_PATH/EasySearch"
          test -d "$SHARE_EXTENSION"
          test -x "$SHARE_EXTENSION/EasySearchShare"

          # Supabase credentials must be injected from secrets, not left as $(VAR).
          for key in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP_PATH/Info.plist")"
            # shellcheck disable=SC2016 -- Match the literal Xcode marker '$('.
            if [[ -z "$value" || "$value" == *'$('* ]]; then
              echo "Info.plist $key was not substituted (got: '$value')." >&2
              exit 1
            fi
          done

          find "$APP_PATH" -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find "$APP_PATH" -type f -name 'embedded.mobileprovision' -delete

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/EasySearch-unsigned.ipa" Payload

      - name: Verify unsigned IPA
        run: |
          set -euo pipefail
          unzip -l EasySearch-unsigned.ipa > "$RUNNER_TEMP/ipa-contents.txt"
          grep -q 'Payload/EasySearch.app/EasySearch' "$RUNNER_TEMP/ipa-contents.txt"
          grep -q 'Payload/EasySearch.app/PlugIns/EasySearchShare.appex/EasySearchShare' "$RUNNER_TEMP/ipa-contents.txt"
          if grep -Eq '_CodeSignature|embedded.mobileprovision' "$RUNNER_TEMP/ipa-contents.txt"; then
            echo 'Unexpected signing files found in unsigned IPA.' >&2
            exit 1
          fi

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasySearch-unsigned-${{ github.run_number }}
          path: EasySearch-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to object storage
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ -z "${S3_ENDPOINT:-}" || -z "${S3_BUCKET:-}" || -z "${S3_ACCESS_KEY:-}" || -z "${S3_SECRET_KEY:-}" ]]; then
            echo "S3 secrets not fully configured; skip object-storage publish."
            exit 0
          fi

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/EasySearch.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          PUBLIC_BASE="${S3_PUBLIC_BASE_URL:-}"
          PUBLIC_BASE="${PUBLIC_BASE%/}"
          if [[ -z "$PUBLIC_BASE" ]]; then
            PUBLIC_BASE="${S3_ENDPOINT%/}/${S3_BUCKET}/easysearch-iOS"
          fi
          IPA_PUBLIC_URL="${PUBLIC_BASE}/EasySearch-unsigned.ipa"
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          VERSION="$VERSION" BUILD="$BUILD" IPA_PUBLIC_URL="$IPA_PUBLIC_URL" \
          RELEASED_AT="$RELEASED_AT" EVENT_BEFORE="${EVENT_BEFORE:-}" \
          python3 - <<'PY' > latest.json
          import json
          import os
          import subprocess

          def git_output(*args: str) -> str:
              try:
                  return subprocess.check_output(["git", *args], text=True).strip()
              except subprocess.CalledProcessError:
                  return ""

          def build_release_notes() -> str:
              """Human-readable update notes for in-app 检测更新 (not GitHub run IDs)."""
              before = (os.environ.get("EVENT_BEFORE") or "").strip()
              sha_zero = "0" * 40
              subjects: list[str] = []

              if before and before != sha_zero and git_output("cat-file", "-t", before) == "commit":
                  log = git_output("log", "--reverse", "--pretty=format:%s", f"{before}..HEAD")
                  subjects = [line.strip() for line in log.splitlines() if line.strip()]

              if not subjects:
                  subject = git_output("log", "-1", "--pretty=format:%s")
                  body = git_output("log", "-1", "--pretty=format:%b")
                  parts: list[str] = []
                  if subject:
                      parts.append(subject)
                  if body:
                      # Drop empty trailing lines from conventional commit bodies.
                      body_lines = [line.rstrip() for line in body.splitlines()]
                      while body_lines and not body_lines[-1]:
                          body_lines.pop()
                      while body_lines and not body_lines[0]:
                          body_lines.pop(0)
                      if body_lines:
                          if parts:
                              parts.append("")
                          parts.extend(body_lines)
                  notes = "\n".join(parts).strip()
              else:
                  # One bullet per commit in this push.
                  notes = "\n".join(f"• {s}" for s in subjects)

              notes = notes.strip() or "版本更新"
              if len(notes) > 2000:
                  notes = notes[:1997] + "..."
              return notes

          build = os.environ["BUILD"]
          print(json.dumps({
              "version": os.environ["VERSION"],
              "build": build,
              "buildNumber": int(build) if str(build).isdigit() else 0,
              "ipaURL": os.environ["IPA_PUBLIC_URL"],
              "releasedAt": os.environ["RELEASED_AT"],
              "notes": build_release_notes(),
          }, ensure_ascii=False, indent=2))
          PY

          echo "Publishing version=$VERSION build=$BUILD"
          cat latest.json

          python3 scripts/upload_to_s3.py \
            --file EasySearch-unsigned.ipa \
            --key easysearch-iOS/EasySearch-unsigned.ipa \
            --content-type application/octet-stream

          python3 scripts/upload_to_s3.py \
            --file latest.json \
            --key easysearch-iOS/latest.json \
            --content-type application/json

          echo "Public IPA: ${IPA_PUBLIC_URL}"
          echo "Public manifest: ${PUBLIC_BASE}/latest.json"
